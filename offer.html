<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tap2Bill - Offers</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-orange: #d2691e;
            --primary-orange-dark: #b85b19;
            --soft-bg: #fffbf7;
        }

        body {
            background-color: var(--soft-bg);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
        }

        /* --- Navbar Styles (Shared) --- */
        .navbar-brand {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary-orange) !important;
            letter-spacing: -0.5px;
        }

        .navbar-nav .nav-link {
            font-weight: 600;
            font-size: 1.15rem;
            color: #495057 !important;
            margin: 0 10px;
        }

        .navbar-nav .nav-link:hover {
            color: var(--primary-orange) !important;
        }

        .btn-orange {
            background-color: var(--primary-orange);
            color: white;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-orange:hover {
            background-color: var(--primary-orange-dark);
            color: white;
        }

        /* --- Offer Section Specifics --- */
        .page-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: #2d3436;
            margin-bottom: 40px;
            padding-top: 40px;
            text-align: center;
        }

        .offer-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            border-top: 4px solid var(--primary-orange);
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            transition: all 0.3s ease;
        }

        .offer-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(210, 105, 30, 0.15);
        }

        .offer-image {
            width: 120px;
            height: 120px;
            border-radius: 10px;
            object-fit: cover;
            border: 2px solid #f8f9fa;
        }

        .offer-details {
            flex: 1;
            padding-left: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .offer-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2d3436;
            margin-bottom: 10px;
        }

        .discount-badge {
            background: linear-gradient(135deg, #00b894 0%, #00a085 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.3rem;
            box-shadow: 0 4px 15px rgba(0, 184, 148, 0.3);
            text-align: center;
        }

        .discount-badge::after {
            content: 'OFF';
            font-size: 0.7rem;
            display: block;
            margin-top: -2px;
        }

        .btn-primary {
            background-color: var(--primary-orange) !important;
            border: none;
        }

        .btn-primary:hover {
            background-color: var(--primary-orange-dark) !important;
        }

        @media (max-width: 768px) {
            .offer-card {
                flex-direction: column;
                text-align: center;
            }
            .offer-details {
                padding-left: 0;
                padding-top: 20px;
            }
            .offer-image {
                margin: 0 auto;
            }
        }
    </style>
</head>

<body>
    <!-- ─── Shared Navbar ─── -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand" href="home.html">Tap2Bill</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-bold" style="color:var(--primary-orange)!important;" href="offer.html">Offer</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="order.html">Order</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="history.html">Bookings</a>
                    </li>
                </ul>
                <div class="d-flex">
                    <a href="login-sign.html" id="signInButton" class="btn btn-orange px-4 rounded-pill">Sign In</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- ─── Main Content ─── -->
    <div class="container pb-5">
        <h1 class="page-title">
            <i class="fas fa-tags me-3 text-warning"></i>Exclusive Deals
        </h1>

        <div class="row justify-content-center">
            <div class="col-lg-8" id="offersContainer">
                
                <!-- Offer 1 -->
                <div class="offer-card d-flex align-items-center">
                    <img src="image/chicken burger.png" onerror="this.src='image/image-1.png'" alt="Chicken Burger" class="offer-image">
                    <div class="offer-details">
                        <h3 class="offer-title">Chicken Burger Combo</h3>
                        <div class="offer-code-section mt-2">
                            <button class="btn btn-primary rounded-pill px-4 redeem-btn" data-code="ABC104" data-percent="10">
                                Redeem Code: ABC104
                            </button>
                        </div>
                    </div>
                    <div class="discount-badge mt-3 mt-md-0 ms-md-3">
                        10%
                    </div>
                </div>

                <!-- Offer 2 -->
                <div class="offer-card d-flex align-items-center">
                    <img src="image/plain dosa).jpg" onerror="this.src='image/image-1.png'" alt="Plain Dosa" class="offer-image">
                    <div class="offer-details">
                        <h3 class="offer-title">Plain Dosa Special</h3>
                        <div class="offer-code-section mt-2">
                            <button class="btn btn-primary rounded-pill px-4 redeem-btn" data-code="AEC107" data-percent="5">
                                Redeem Code: AEC107
                            </button>
                        </div>
                    </div>
                    <div class="discount-badge mt-3 mt-md-0 ms-md-3">
                        5%
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS and jQuery -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

    <!-- Original JS Logic -->
    <script>
        $(document).ready(function () {
            // Check for already redeemed active offer
            const activeOffer = JSON.parse(localStorage.getItem('activeOffer'));
            if (activeOffer) {
                // If offer exists, find the button and mark as applied
                $(`.redeem-btn[data-code="${activeOffer.code}"]`)
                    .text('Applied \u2714')
                    .removeClass('btn-primary')
                    .addClass('btn-success')
                    .prop('disabled', true);
            }

            $('.redeem-btn').click(function () {
                const code = $(this).data('code');
                const percent = $(this).data('percent');

                // Save to localStorage
                const offerData = { code: code, percent: percent };
                localStorage.setItem('activeOffer', JSON.stringify(offerData));

                // Reset other buttons
                $('.redeem-btn').text('Redeem').removeClass('btn-success').addClass('btn-primary').prop('disabled', false);

                // Update clicked button
                $(this)
                    .text('Applied \u2714')
                    .removeClass('btn-primary')
                    .addClass('btn-success')
                    .prop('disabled', true);

                alert('Offer Applied! Discount will be deducted on the Order page.');
            });

            // Auth Login checks
            const currentUser = localStorage.getItem('currentUser');
            const signInBtn = document.getElementById('signInButton');
            if (currentUser && signInBtn) {
                signInBtn.textContent = 'Logout';
                signInBtn.href = '#';
                signInBtn.addEventListener('click', function (e) {
                    e.preventDefault();
                    if (confirm('Are you sure you want to logout?')) {
                        localStorage.removeItem('currentUser');
                        window.location.reload();
                    }
                });
            }
        });
    </script>
</body>
</html>
