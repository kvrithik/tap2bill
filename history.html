<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Tap2Bill</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome & Bootstrap Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-orange: #d2691e;
            --primary-orange-dark: #b85b19;
            --soft-bg: #fffbf7;
        }

        body {
            background-color: var(--soft-bg);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
        }

        /* --- Navbar Styles (Shared) --- */
        .navbar-brand {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary-orange) !important;
            letter-spacing: -0.5px;
        }

        .navbar-nav .nav-link {
            font-weight: 600;
            font-size: 1.15rem;
            color: #495057 !important;
            margin: 0 10px;
        }

        .navbar-nav .nav-link:hover {
            color: var(--primary-orange) !important;
        }

        .btn-orange {
            background-color: var(--primary-orange);
            color: white;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-orange:hover {
            background-color: var(--primary-orange-dark);
            color: white;
        }

        /* --- Order History Specifics --- */
        .page-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: #2d3436;
            margin: 40px 0 30px 0;
            text-align: center;
        }

        .order-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            border: none;
            border-top: 4px solid var(--primary-orange);
            transition: all 0.3s ease;
        }

        .order-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(210, 105, 30, 0.15);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f1f3f5;
        }

        .order-date {
            color: #6c757d;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .order-total {
            font-weight: 700;
            color: var(--primary-orange);
            font-size: 1.2rem;
        }

        .item-list {
            margin-top: 15px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 1rem;
            color: #495057;
        }

        .order-actions {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed #f1f3f5;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn-action {
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-view-bill {
            background-color: #f8f9fa;
            color: #495057;
            border: 1px solid #dee2e6;
        }

        .btn-view-bill:hover {
            background-color: #e9ecef;
            color: #212529;
        }

        .btn-rate {
            background-color: #fff8e6;
            color: #bfa11d;
            border: 1px solid #ffeeba;
        }

        .btn-rate:hover {
            background-color: #ffeeba;
        }

        /* Star Rating */
        .rating-stars {
            display: flex;
            flex-direction: row-reverse;
            justify-content: center;
            font-size: 2.5rem;
        }

        .rating-stars input {
            display: none;
        }

        .rating-stars label {
            color: #e9ecef;
            cursor: pointer;
            padding: 0 8px;
            transition: color 0.2s;
        }

        .rating-stars input:checked~label,
        .rating-stars label:hover,
        .rating-stars label:hover~label {
            color: #ffc107;
        }
    </style>
</head>

<body>

    <!-- ─── Shared Navbar ─── -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand" href="home.html">Tap2Bill</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="offer.html">Offer</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="order.html">Order</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-bold" style="color:var(--primary-orange)!important;" href="history.html">Bookings</a>
                    </li>
                </ul>
                <div class="d-flex">
                    <a href="login-sign.html" id="signInButton" class="btn btn-orange px-4 rounded-pill">Sign In</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <h2 class="page-title"><i class="fas fa-history me-3 text-muted"></i>My Orders</h2>
        <div class="row justify-content-center">
            <div class="col-lg-8" id="ordersList">
                <div class="text-center mt-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-3 text-muted">Loading orders...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Rating Modal -->
    <div class="modal fade" id="ratingModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header border-bottom-0">
                    <h5 class="modal-title fw-bold">Rate Your Meal</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <p class="text-muted mb-4">How was your experience?</p>

                    <div class="rating-stars mb-4">
                        <input type="radio" name="rating" id="star5" value="5"><label for="star5"><i class="fas fa-star"></i></label>
                        <input type="radio" name="rating" id="star4" value="4"><label for="star4"><i class="fas fa-star"></i></label>
                        <input type="radio" name="rating" id="star3" value="3"><label for="star3"><i class="fas fa-star"></i></label>
                        <input type="radio" name="rating" id="star2" value="2"><label for="star2"><i class="fas fa-star"></i></label>
                        <input type="radio" name="rating" id="star1" value="1"><label for="star1"><i class="fas fa-star"></i></label>
                    </div>

                    <div class="form-floating mb-3">
                        <textarea class="form-control" placeholder="Leave a comment here" id="reviewComment" style="height: 100px; border-radius:10px;"></textarea>
                        <label for="reviewComment">Comments (Optional)</label>
                    </div>
                </div>
                <div class="modal-footer border-top-0 justify-content-center pb-4">
                    <button type="button" class="btn btn-orange rounded-pill px-5" onclick="submitRating()">Submit Review</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentOrderIdForRating = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const currentUserStr = localStorage.getItem('currentUser');
            const signInBtn = document.getElementById('signInButton');

            if (currentUserStr && signInBtn) {
                signInBtn.textContent = 'Logout';
                signInBtn.href = '#';
                signInBtn.addEventListener('click', function (e) {
                    e.preventDefault();
                    if (confirm('Are you sure you want to logout?')) {
                        localStorage.removeItem('currentUser');
                        window.location.reload();
                    }
                });
            }

            const currentUser = JSON.parse(currentUserStr);

            if (!currentUser || !currentUser.id) {
                document.getElementById('ordersList').innerHTML = `
                    <div class="text-center mt-5">
                        <h4 class="text-muted">Please login to view history</h4>
                        <a href="login-sign.html" class="btn btn-orange rounded-pill px-4 mt-3">Login Now</a>
                    </div>
                `;
                return;
            }

            try {
                const response = await fetch(`/api/orders/${currentUser.id}`);
                const data = await response.json();

                const ordersList = document.getElementById('ordersList');
                ordersList.innerHTML = '';

                if (data.success && data.orders.length > 0) {
                    data.orders.forEach(order => {
                        const date = new Date(order.date).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
                        let itemsHtml = '';
                        order.items.forEach(item => {
                            itemsHtml += `
                                <div class="item-row">
                                    <span class="fw-medium">${item.name} <span class="text-muted">x ${item.quantity}</span></span>
                                    <span class="fw-bold text-dark">₹${(item.price * item.quantity).toFixed(2)}</span>
                                </div>
                            `;
                        });

                        const orderJson = JSON.stringify(order).replace(/"/g, '&quot;');

                        const card = `
                            <div class="order-card">
                                <div class="order-header">
                                    <span class="order-date"><i class="far fa-calendar-alt me-2"></i>${date}</span>
                                    <span class="order-total">Total: ₹${parseFloat(order.totalAmount).toFixed(2)}</span>
                                </div>
                                <div class="item-list">
                                    ${itemsHtml}
                                </div>
                                <div class="order-actions">
                                    <button class="btn btn-action btn-rate" onclick="openRatingModal('${order._id}')">
                                        <i class="fas fa-star me-1"></i> Rate
                                    </button>
                                    <button class="btn btn-action btn-view-bill" onclick='viewBill(${orderJson})'>
                                        <i class="fas fa-file-invoice me-1"></i> View Bill
                                    </button>
                                </div>
                            </div>
                        `;
                        ordersList.insertAdjacentHTML('beforeend', card);
                    });
                } else {
                    ordersList.innerHTML = `
                        <div class="text-center mt-5 py-5 bg-white rounded shadow-sm border">
                            <h3 class="fw-bold mt-3">No orders found</h3>
                            <p class="text-muted">You haven't placed any orders yet.</p>
                            <a href="home.html" class="btn btn-orange rounded-pill px-4 mt-2">Start Ordering</a>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error fetching orders:', error);
                document.getElementById('ordersList').innerHTML = '<div class="text-center text-danger py-5">Error loading orders. Please try again later.</div>';
            }
        });

        function viewBill(order) {
            const billData = {
                orderId: order._id,
                items: order.items,
                totalAmount: order.totalAmount
            };
            localStorage.setItem('currentOrder', JSON.stringify(billData));
            window.location.href = 'bill.html';
        }

        function openRatingModal(orderId) {
            currentOrderIdForRating = orderId;
            document.querySelectorAll('.rating-stars input').forEach(el => el.checked = false);
            document.getElementById('reviewComment').value = '';
            const myModal = new bootstrap.Modal(document.getElementById('ratingModal'));
            myModal.show();
        }

        function submitRating() {
            const selectedRating = document.querySelector('input[name="rating"]:checked');
            const comment = document.getElementById('reviewComment').value;

            if (!selectedRating) {
                alert('Please select a star rating');
                return;
            }

            const rating = selectedRating.value;
            console.log(`Submitting rating for Order ${currentOrderIdForRating}: ${rating} stars, Comment: ${comment}`);

            const modalEl = document.getElementById('ratingModal');
            const modal = bootstrap.Modal.getInstance(modalEl);
            modal.hide();

            alert('Thank you for your feedback!');
        }
    </script>
</body>
</html>
