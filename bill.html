<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Receipt - Tap2Bill</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .bill-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            border-bottom: 2px dashed #ddd;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .header h2 {
            color: #d2691e;
            font-weight: bold;
        }

        .order-details {
            margin-bottom: 20px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .total-section {
            border-top: 2px dashed #ddd;
            padding-top: 20px;
            margin-top: 20px;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 5px;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #666;
            font-size: 14px;
        }

        .btn-home {
            background: #d2691e;
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 25px;
            margin-top: 20px;
            display: inline-block;
            text-decoration: none;
            font-weight: bold;
        }

        .btn-home:hover {
            background: #b55a19;
            color: white;
        }

        .timer-section {
            background-color: #fff3cd;
            color: #856404;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
            border: 1px solid #ffeeba;
        }

        .timer-display {
            font-size: 24px;
            font-weight: bold;
            font-family: monospace;
            margin-top: 5px;
            color: #d2691e;
        }
    </style>
</head>

<body>

    <div class="bill-container">
        <div class="header">
            <h2>Tap2Bill</h2>
            <p>Order Receipt</p>
            <p id="orderDate"></p>
            <p id="orderId" style="font-size: 12px; color: #999;"></p>
        </div>

        <div id="itemsList" class="order-details">
            <!-- Items will be injected here -->
        </div>

        <div class="total-section">
            <div class="total-row">
                <span>Total Amount:</span>
                <span id="totalAmount">₹0.00</span>
            </div>
        </div>

        <div class="timer-section">
            <div>Your order will get ready in</div>
            <div id="countdownTimer" class="timer-display">10:00</div>
        </div>

        <div class="footer">
            <p>Thank you for dining with us!</p>
            <a href="home.html" class="btn-home">Back to Home</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const currentOrder = JSON.parse(localStorage.getItem('currentOrder'));

            if (!currentOrder) {
                document.querySelector('.bill-container').innerHTML = '<div class="text-center"><h3>No recent order found</h3><a href="home.html" class="btn-home">Go Home</a></div>';
                return;
            }

            document.getElementById('orderDate').textContent = new Date().toLocaleString();
            document.getElementById('orderId').textContent = 'Order ID: ' + (currentOrder.orderId || 'N/A');
            document.getElementById('totalAmount').textContent = '₹' + parseFloat(currentOrder.totalAmount).toFixed(2);

            const itemsList = document.getElementById('itemsList');
            currentOrder.items.forEach(item => {
                const row = document.createElement('div');
                row.className = 'item-row';
                row.innerHTML = `
                    <span>${item.name} x ${item.quantity}</span>
                    <span>₹${(item.price * item.quantity).toFixed(2)}</span>
                `;
                itemsList.appendChild(row);
            });

            // Timer logic
            const timerDisplay = document.getElementById('countdownTimer');
            let timeLeft = 10 * 60; // 10 minutes in seconds
            
            const orderKey = `orderTimer_${currentOrder.orderId || 'default'}`;
            const storedStartTime = localStorage.getItem(orderKey);
            
            if (storedStartTime) {
                const elapsedSeconds = Math.floor((Date.now() - parseInt(storedStartTime)) / 1000);
                timeLeft = Math.max(0, timeLeft - elapsedSeconds);
            } else {
                localStorage.setItem(orderKey, Date.now().toString());
            }

            const updateTimer = () => {
                if (timeLeft > 0) {
                    const minutes = Math.floor(timeLeft / 60);
                    const seconds = timeLeft % 60;
                    timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                    timeLeft--;
                } else {
                    timerDisplay.textContent = "Your order is ready!";
                    timerDisplay.style.color = "green";
                    clearInterval(timerInterval);
                }
            };
            
            updateTimer(); // Initial call
            const timerInterval = setInterval(updateTimer, 1000);
        });
    </script>
</body>

</html>
